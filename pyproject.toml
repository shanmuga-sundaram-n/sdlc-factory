[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-factory"
version = "0.1.0"
description = "Autonomous multi-agent software delivery pipeline"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    # LLM client — OpenAI-compatible, works with Anthropic/OpenAI/etc.
    "openai>=1.35.0",
    # Config
    "pyyaml>=6.0",
    # Structured output validation
    "jsonschema>=4.22",
    # HTTP (for Slack / webhook gates)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
otel = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]
ui = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
sdlc = "sdlc:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "gateway*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
